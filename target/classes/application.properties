server.port=8082

spring.application.name=rms-backend

spring.datasource.url=jdbc:mysql://192.168.1.9:3306/reinsurance_data?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=MSDB
spring.datasource.password=Admin

spring.jpa.open-in-view=false
# set to "validate" once the schema is loaded to verify entity <-> table mapping
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
#spring.flyway.locations=classpath:db/migration

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# number of approval levels required to activate a treaty / treaty version
rms.makerchecker.levels.treaty=2
# levels required to apply a reinsurer-share modification on a policy or claim
rms.makerchecker.levels.distribution=1
rms.makerchecker.authority.level1=TREATY_CHECK
rms.makerchecker.authority.level2=TREATY_APPROVE_FINAL
rms.cors.allowed-origins=http://localhost:4200,http://192.168.1.6:8082,http://192.168.1.18:4700

management.endpoints.web.exposure.include=health,info
